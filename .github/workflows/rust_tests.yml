name: Rust Compiler Tests

on:
  pull_request:
    paths:
      - 'rust/**'
      - '.github/workflows/rust_tests.yml'
  push:
    branches-ignore:
      - 'master'
    paths:
      - 'rust/**'
      - '.github/workflows/rust_tests.yml'

defaults:
  run:
    working-directory: rust/nwscript-compiler

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/nwscript-compiler

      - name: Cargo test
        run: cargo test --release

      - name: Install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli --locked

      - name: Build WASM
        run: cargo build --target wasm32-unknown-unknown --release

      - name: Generate JS bindings
        run: wasm-bindgen --target nodejs --out-dir pkg target/wasm32-unknown-unknown/release/nwscript_compiler.wasm

      - name: Run WASM tests
        run: node tests/wasm_test.js
